<title>Rangdhanu Hostel Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
  rel="stylesheet"
/>
<style>
  /* Deliberately single light theme: a client-facing prototype that should look the same for everyone. */
  :root {
    color-scheme: light;
    --bg: #f2f3f8;
    --surface: #ffffff;
    --surface-2: #f7f8fc;
    --surface-3: #eef0f6;
    --ink: #161a2e;
    --ink-2: #3a405c;
    --muted: #666d8c;
    --faint: #9aa0ba;
    --line: #e0e3ee;
    --line-2: #eceef5;
    --brand: #3340b0;
    --brand-600: #28339a;
    --brand-50: #eef0fc;
    --brand-100: #dde1fa;
    --admin: #3340b0;
    --admin-50: #eef0fc;
    --cashier: #0c7b7f;
    --cashier-50: #e6f5f5;
    --student: #c9581a;
    --student-50: #fdf0e7;
    --auto: #6b3fa0;
    --auto-50: #f3edfa;
    --ok: #15803d;
    --ok-bg: #effbf2;
    --ok-line: #bfe8cb;
    --warn: #a15c07;
    --warn-bg: #fff8e6;
    --warn-line: #f6dc9c;
    --bad: #b42323;
    --bad-bg: #fdf1f1;
    --bad-line: #f4c9c9;
    --head: #12162a;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(22, 26, 46, 0.05), 0 2px 10px rgba(22, 26, 46, 0.05);
    --shadow-lg: 0 24px 60px rgba(22, 26, 46, 0.22);
    --font: "IBM Plex Sans", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
    --bn: "Hind Siliguri", "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  * {
    box-sizing: border-box;
  }
  html,
  body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 14.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button,
  input,
  select {
    font: inherit;
    color: inherit;
  }
  button {
    cursor: pointer;
  }
  h1,
  h2,
  h3 {
    margin: 0;
    text-wrap: balance;
  }
  p {
    margin: 0;
  }
  .bn {
    font-family: var(--bn);
  }
  .num {
    font-variant-numeric: tabular-nums;
  }
  .mono {
    font-family: var(--mono);
    font-size: 0.9em;
  }
  .muted {
    color: var(--muted);
  }
  :focus-visible {
    outline: 3px solid rgba(51, 64, 176, 0.45);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ---------- Top bar ---------- */
  .top {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 60;
    background: var(--head);
    color: #e6e8f4;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 16px;
    flex-wrap: wrap;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .logo .mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: #1f2440;
    display: grid;
    place-items: center;
    overflow: hidden;
    flex: none;
  }
  .rain {
    display: flex;
    width: 22px;
    height: 14px;
    border-radius: 3px;
    overflow: hidden;
  }
  .rain i {
    flex: 1;
  }
  .logo b {
    display: block;
    font-family: var(--bn);
    font-size: 16px;
    line-height: 1.1;
    color: #fff;
  }
  .logo span {
    font-size: 11.5px;
    color: #9ea4c4;
  }
  .seg {
    display: flex;
    gap: 3px;
    background: #1d2238;
    border: 1px solid #2a3050;
    border-radius: 10px;
    padding: 3px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: #c7cbe0;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .seg button:hover {
    background: #262c48;
    color: #fff;
  }
  .seg button[aria-pressed="true"] {
    background: #fff;
    color: var(--ink);
  }
  .seg button i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .top .sp {
    flex: 1;
  }
  .top select {
    background: #1d2238;
    border: 1px solid #2a3050;
    color: #e6e8f4;
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .tbtn {
    border: 1px solid #2a3050;
    background: #1d2238;
    color: #e6e8f4;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .tbtn:hover {
    background: #262c48;
  }
  .tbtn.on {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .clock {
    font-size: 12px;
    color: #9ea4c4;
    font-family: var(--mono);
    white-space: nowrap;
  }

  /* ---------- Common UI ---------- */
  .btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    font-size: 13.5px;
    padding: 8px 13px;
    border-radius: 9px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--surface-2);
  }
  .btn.pri {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .btn.pri:hover {
    background: var(--brand-600);
  }
  .btn.ok {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }
  .btn.sm {
    padding: 5px 10px;
    font-size: 12.5px;
    border-radius: 8px;
  }
  .btn.ghost {
    border-color: transparent;
    background: transparent;
  }
  .btn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .card .ch {
    padding: 14px 18px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .card .ch h3 {
    font-size: 15px;
  }
  .card .ch p {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .card .cb {
    padding: 14px 18px 18px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 650;
    padding: 2px 8px;
    border-radius: 20px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .pill.ok {
    background: var(--ok-bg);
    color: var(--ok);
    border-color: var(--ok-line);
  }
  .pill.warn {
    background: var(--warn-bg);
    color: var(--warn);
    border-color: var(--warn-line);
  }
  .pill.bad {
    background: var(--bad-bg);
    color: var(--bad);
    border-color: var(--bad-line);
  }
  .pill.gray {
    background: var(--surface-3);
    color: var(--ink-2);
    border-color: var(--line);
  }
  .pill.new {
    background: var(--brand-50);
    color: var(--brand);
    border-color: var(--brand-100);
  }
  .tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .tbl th {
    text-align: left;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  .tbl td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--line-2);
    vertical-align: middle;
  }
  .tbl tr:last-child td {
    border-bottom: 0;
  }
  .tbl .r {
    text-align: right;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tbl tr.click {
    cursor: pointer;
  }
  .tbl tr.click:hover td {
    background: var(--surface-2);
  }
  .tbl tr.tot td {
    font-weight: 700;
    background: var(--surface-2);
  }
  .tw {
    overflow-x: auto;
  }
  .red {
    color: var(--bad);
  }
  .green {
    color: var(--ok);
  }
  .grid {
    display: grid;
    gap: 14px;
  }
  .g4 {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .g3 {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .g2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .kpi {
    padding: 14px 16px;
  }
  .kpi .l {
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }
  .kpi .v {
    font-size: 25px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    margin-top: 2px;
  }
  .kpi .n {
    font-size: 12px;
    color: var(--muted);
  }
  .kpi.click {
    cursor: pointer;
  }
  .kpi.click:hover {
    border-color: var(--brand-100);
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .field label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .field input,
  .field select {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 9px;
    padding: 8px 10px;
    font-size: 14px;
    width: 100%;
  }
  .field .hint {
    font-size: 11.5px;
    color: var(--muted);
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .kv {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 16px;
    font-size: 13.5px;
  }
  .kv dt {
    color: var(--muted);
  }
  .kv dd {
    margin: 0;
    font-weight: 550;
    overflow-wrap: anywhere;
  }
  .note {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--surface-2);
  }
  .note.warn {
    background: var(--warn-bg);
    border-color: var(--warn-line);
  }
  .note.ok {
    background: var(--ok-bg);
    border-color: var(--ok-line);
  }
  .note.info {
    background: var(--brand-50);
    border-color: var(--brand-100);
  }
  .tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .tabs button {
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-2);
  }
  .tabs button.on {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  /* ---------- MAP ---------- */
  .map {
    max-width: 1180px;
    margin: 0 auto;
    padding-block: 26px 70px;
    padding-inline: 20px;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
    gap: 22px;
    align-items: stretch;
  }
  .hero h1 {
    font-family: var(--bn);
    font-size: 34px;
    line-height: 1.2;
    font-weight: 700;
  }
  .hero .lead {
    font-family: var(--bn);
    font-size: 17px;
    color: var(--ink-2);
    margin-top: 10px;
    max-width: 60ch;
  }
  .hero .cta {
    margin-top: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .hero .facts {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .hero .fact {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .hero .fact b {
    display: block;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .hero .fact span {
    font-family: var(--bn);
    font-size: 13px;
    color: var(--muted);
  }
  .sec h2 {
    font-family: var(--bn);
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .sec h2 small {
    font-family: var(--font);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sec .sub {
    font-family: var(--bn);
    color: var(--muted);
    font-size: 14.5px;
    margin-top: 4px;
    max-width: 75ch;
  }
  .sec .body {
    margin-top: 14px;
  }
  .roles3 {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  .rolec {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .rolec .rh {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line-2);
  }
  .rolec .ri {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    flex: none;
  }
  .rolec .rh b {
    display: block;
    font-family: var(--bn);
    font-size: 16px;
  }
  .rolec .rh span {
    font-size: 12px;
    color: var(--muted);
  }
  .rolec ul {
    margin: 0;
    padding: 12px 16px 14px 34px;
    font-family: var(--bn);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .rolec .lim {
    margin: 0 16px 14px;
    font-family: var(--bn);
    font-size: 12.5px;
    color: var(--muted);
    background: var(--surface-2);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .chain {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: stretch;
  }
  .chip {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    min-width: 130px;
    flex: 1 1 130px;
    font-family: var(--bn);
  }
  .chip b {
    display: block;
    font-size: 14.5px;
  }
  .chip span {
    font-size: 12.5px;
    color: var(--muted);
  }
  .chip .k {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--faint);
  }
  .arrow {
    align-self: center;
    color: var(--faint);
    font-size: 18px;
    flex: none;
  }

  /* swimlane journey */
  .lanes {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .lanehead,
  .lanerow {
    display: grid;
    grid-template-columns: 52px repeat(4, minmax(0, 1fr));
  }
  .lanehead div {
    padding: 10px 12px;
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 7px;
    border-bottom: 1px solid var(--line);
  }
  .lanehead div i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
  }
  .lanerow {
    position: relative;
  }
  .lanerow > div {
    border-right: 1px dashed var(--line-2);
    min-height: 20px;
  }
  .lanerow > div:last-child {
    border-right: 0;
  }
  .lanerow .no {
    display: flex;
    justify-content: center;
    position: relative;
  }
  .lanerow .no::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 2px;
    background: var(--line);
    transform: translateX(-1px);
  }
  .lanerow.first .no::before {
    top: 22px;
  }
  .lanerow.last .no::before {
    bottom: auto;
    height: 22px;
  }
  .lanerow .no span {
    position: relative;
    margin-top: 12px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  .step {
    margin: 8px 10px 10px;
    border-radius: 12px;
    padding: 11px 13px;
    border: 1px solid;
    font-family: var(--bn);
  }
  .step b {
    display: block;
    font-size: 15px;
  }
  .step p {
    font-size: 13.5px;
    color: var(--ink-2);
    margin-top: 3px;
  }
  .step ul {
    margin: 6px 0 0;
    padding-left: 18px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .step .lw {
    font-family: var(--font);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: none;
  }
  .step.admin {
    border-color: #cfd4f5;
    background: var(--admin-50);
  }
  .step.admin .lw {
    color: var(--admin);
  }
  .step.cashier {
    border-color: #bfe3e4;
    background: var(--cashier-50);
  }
  .step.cashier .lw {
    color: var(--cashier);
  }
  .step.student {
    border-color: #f5d3bd;
    background: var(--student-50);
  }
  .step.student .lw {
    color: var(--student);
  }
  .step.auto {
    border-color: #dccbf0;
    background: var(--auto-50);
  }
  .step.auto .lw {
    color: var(--auto);
  }
  .also {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* month calendar */
  .cal {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }
  .cal .dh {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
  }
  .cal .d {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 9px;
    min-height: 62px;
    padding: 6px 7px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .cal .d .n {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .cal .d.pay {
    background: var(--ok-bg);
    border-color: var(--ok-line);
  }
  .cal .d.me {
    background: var(--auto-50);
    border-color: #cdb8ea;
  }
  .cal .d.blank {
    background: transparent;
    border-style: dashed;
    border-color: var(--line-2);
  }
  .cal .tag {
    font-family: var(--bn);
    font-size: 11px;
    line-height: 1.25;
    color: var(--ink-2);
  }
  .cal .dots {
    display: flex;
    gap: 2px;
    margin-top: auto;
  }
  .cal .dots i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #c9cde0;
  }
  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-family: var(--bn);
    font-size: 13px;
    color: var(--ink-2);
    margin-top: 10px;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .legend i {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid var(--line);
  }

  /* money example */
  .paper {
    background: #fffdf7;
    border: 1px solid #e9e1c8;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
  }
  .paper h4 {
    margin: 0 0 6px;
    font-size: 13px;
    text-align: center;
  }
  .paper table {
    width: 100%;
    border-collapse: collapse;
  }
  .paper td {
    padding: 3px 0;
    border-bottom: 1px dotted #e3dbc1;
  }
  .paper td:last-child {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .paper tr.t td {
    font-weight: 700;
    border-bottom: 0;
    border-top: 1px solid #d9cfb0;
  }
  .eq {

  /* ---------- ledger ---------- */
  function post(sid, period, head, amt, src, note, date) {
    if (!amt) return;
    S.ledger.push({ sid, period, head, dr: amt > 0 ? amt : 0, cr: amt < 0 ? -amt : 0, src, note, date: date || S.now });
  }
  const linesOf = (sid) => S.ledger.filter((l) => l.sid === sid);
  function balances(sid) {
    const b = {};
    for (const l of linesOf(sid)) {
      b[l.head] = (b[l.head] || 0) + l.dr - l.cr;
    }
    for (const k in b) if (Math.abs(b[k]) < 0.005) delete b[k];
    return b;
  }
  const totalOf = (sid) => Math.round(Object.values(balances(sid)).reduce((a, b) => a + b, 0) * 100) / 100;
  function dues(sid) {
    const out = [];
    for (const h of ALLOC) {
      const ls = linesOf(sid).filter((l) => l.head === h);
      let credit = ls.reduce((a, l) => a + l.cr, 0);
      for (const l of ls.filter((l) => l.dr > 0).sort((a, b) => a.period.localeCompare(b.period))) {
        const pay = Math.min(credit, l.dr);
        credit -= pay;
        if (l.dr - pay > 0.004) out.push({ period: l.period, head: h, amt: l.dr - pay });
      }
    }
    // merge same period+head
    const m = {};
    for (const d of out) {
      const k = d.period + "|" + d.head;
      m[k] = m[k] ? { ...m[k], amt: m[k].amt + d.amt } : { ...d };
    }
    return Object.values(m).sort(
      (a, b) => a.period.localeCompare(b.period) || ALLOC.indexOf(a.head) - ALLOC.indexOf(b.head),
    );
  }
  function advanceHeld(sid) {
    return Math.max(
      0,
      linesOf(sid)
        .filter((l) => l.head === "advance" && ["payment", "opening_payment", "netting"].includes(l.src))
        .reduce((a, l) => a + l.cr - l.dr, 0),
    );
  }
  function netting(sid, period) {
    const b = balances(sid);
    const negs = Object.entries(b)
      .filter(([h, v]) => v < 0)
      .sort((a, b) => (a[0] === "credit" ? -1 : 0) - (b[0] === "credit" ? -1 : 0));
    for (const [h, v] of negs) {
      let c = -v;
      for (const d of dues(sid)) {
        if (c <= 0.004) break;
        if (d.head === h) continue;
        const x = Math.min(c, d.amt);
        post(sid, d.period, d.head, -x, "netting", "Adjusted from " + HL[h]);
        post(sid, period, h, x, "netting", "Used for " + HL[d.head]);
        c -= x;
      }
    }
  }

    const c = { b: 0, l: 0, d: 0, days: 0 };
    for (const d of datesOf(period)) {
      if (until && d > until) break;
      if (!inHostel(s, d)) continue;

  function makeToken(s, period, kind, lines) {

      head: h,

    const cur = lines || [
      { head: "rent", label: "Rent", amt: s.rent },
      { head: "meal", label: "Meal deposit", amt: S.rates.dep },
      { head: "baburchi", label: "Baburchi bill", amt: S.rates.bab },
    ];
    for (const l of cur)
      post(
        s.id,
        period,
        l.head,
        l.amt,
        kind === "admission" ? "admission" : "token",
        l.label,
        kind === "admission" ? S.now : period + "-01",
      );
    const curT = cur.reduce((a, l) => a + l.amt, 0),
      prevT = prev.reduce((a, l) => a + l.amt, 0);
    const t = {
      id: "T" + (S.tokens.length + 1),
      sid: s.id,
      period,
      kind,
      cur,
      prev,
      curT,
      prevT,

  function tokenStatus(t) {
    const remaining = dues(t.sid)

  }

  function takePayment(sid, amt, acct, date, trx, by, silent) {
    const allocs = [];
    let left = amt;
    for (const d of dues(sid)) {
      if (left <= 0.004) break;
      const x = Math.min(left, d.amt);
      allocs.push({ period: d.period, head: d.head, amt: x });
      left -= x;
    }
    if (left > 0.004) allocs.push({ period: S.period, head: "credit", amt: left });
    S.counters.receipt++;
    const no = "R-" + String(S.counters.receipt).padStart(6, "0");
    const before = totalOf(sid);
    for (const a of allocs) post(sid, a.period, a.head, -a.amt, "payment", no, date);
    const p = { no, sid, amt, acct, date, trx, by, allocs, before, after: totalOf(sid) };

  function settle(s, period) {

      .filter((l) => l.head === "meal" && l.period === period && ["token", "admission"].includes(l.src))
      .reduce((a, l) => a + l.dr, 0);
    const diff = Math.round((cost - deposit) * 100) / 100;
    post(s.id, period, "meal", diff, "settlement", `Meal settlement ${monthName(period)}`, nextP(period) + "-01");
    const r = { sid: s.id, period, ...c, cost, deposit, diff };

        return { s, c, cost, deposit, diff: cost - deposit };

  function applyTour() {
    document.querySelectorAll(".tour").forEach((n) => n.classList.remove("tour"));
    if (UI.mode !== "demo") {
      return;
    }
    const cur = curStep();
    if (lastStep !== null && cur > lastStep) {
      toast(`ধাপ ${cur} শেষ ✓`, cur < STEPS.length ? `পরের ধাপ: ${STEPS[cur].t}` : "পুরো গাইড শেষ!");
    }
    lastStep = cur;
    if (!UI.guide || cur >= STEPS.length || MODAL) return;
    const s = STEPS[cur];
    let key = s.tour;
    if (UI.role !== s.role) key = "role-" + s.role;
    else if (s.go.view && UI.view !== s.go.view) {
      key = UI.role === "student" ? "ptab-" + s.go.view : "nav-" + UI.role + "-" + s.go.view;
    }
    const el = document.querySelector(`[data-tour="${key}"]`);
    if (el) el.classList.add("tour");
  }

      <table class="tbl" style="margin-top:10px"><thead><tr><th>For</th><th class="r">Amount</th></tr></thead><tbody>${p.allocs.map((x) => `<tr><td>${monthName(x.period)} · ${HL[x.head]}</td><td class="r">${tk(x.amt)}</td></tr>`).join("")}<tr class="tot"><td>Paid</td><td class="r">${tk(p.amt)}</td></tr></tbody></table>
      <div class="row" style="justify-content:space-between;margin-top:8px"><span class="muted">Due before: ${tk(Math.max(0, p.before))}</span><b class="${p.after > 0 ? "red" : "green"}">${p.after > 0 ? "Remaining due " + tk(p.after) : "Fully paid"}</b></div></div>

        `<button class="btn" data-act="close">Close</button>`,

    if (m.type === "token") {
      const t = S.tokens.find((x) => x.id === m.id),

  /* ================================================================ Actions */
  function toast(t, s) {
    const d = document.createElement("div");
    d.className = "toast";
    d.innerHTML = `<b>${esc(t)}</b>${s ? `<small>${esc(s)}</small>` : ""}`;
    $("#toasts").appendChild(d);
    setTimeout(() => d.remove(), 3800);
  }
  function go(view, p = {}) {
    UI.view = view;
    UI.p = p;
    MODAL = null;
    render();
    window.scrollTo(0, 0);
  }
  const ACT = {
    guide() {
      UI.guide = !UI.guide;
      render();
    },
    reset() {
      try {
        localStorage.removeItem(KEY);
      } catch (_) {}
      S = freshState();
      seedHistory();
      UI = { mode: "demo", role: "admin", view: "dash", sid: "10005", p: {}, guide: true, seen: {}, open: {} };
      MODAL = null;
      lastStep = 0;
      render();
      toast("Demo reset", "সব আবার শুরু থেকে।");
    },
    close() {
      MODAL = null;
      render();
    },
    ov(e) {
      if (e.target.classList.contains("ov")) {
        MODAL = null;
        render();
      }
    },
    toast(e, el) {
      toast(el.dataset.t, el.dataset.s);
    },
    "g-toggle"(e, el) {
      UI.open[el.dataset.id] = !UI.open[el.dataset.id];
      render();
    },
    "g-go"(e, el) {
      const s = STEPS[+el.dataset.id];
      UI.mode = "demo";
      UI.role = s.role;
      if (s.go.sid === "rahim" && rahim()) UI.sid = rahim().id;
      MODAL = null;
      go(s.go.view, s.go.p || {});
    },
    admit() {
      MODAL = { type: "admit", step: 0, f: { batch: "2026" } };
      render();
    },
    "admit-example"() {
      const fs = freeSeats();
      const pick = fs.find((x) => x.bld === "207" && x.room === "603") || fs[0];
      MODAL.f = {
        name: "Rahim Uddin",
        phone: "01711223344",
        father: "Karim Uddin",
        guardian: "01911223344",
        school: "Bhola Govt. High School",
        college: "Notre Dame College",
        batch: "2026",
        seat: `${pick.bld}|${pick.room}|${pick.seat}`,
        rent: String(pick.rent),
      };
      render();
    },
    "admit-back"() {
      MODAL.step--;
      render();
    },
    "admit-next"() {
      const f = MODAL.f;
      if (MODAL.step === 0) {
        if (!f.name || f.name.trim().length < 2) {
          toast("Name is missing");
          return;
        }
        if (!/^01[3-9]\d{8}$/.test((f.phone || "").replace(/\D/g, ""))) {
          toast("Enter a valid mobile number", "যেমন 01711223344");
          return;
        }
        if (S.students.some((s) => s.phone === f.phone.replace(/\D/g, ""))) {
          toast("This phone is already used");
          return;
        }
        if (!f.seat) {
          const x = freeSeats()[0];
          f.seat = `${x.bld}|${x.room}|${x.seat}`;
          f.rent = String(x.rent);
        }
        MODAL.step = 1;
        render();
        return;
      }
      if (MODAL.step === 1) {
        if (!(+f.rent > 0)) {
          toast("Enter the monthly rent");
          return;
        }
        MODAL.step = 2;
        render();
        return;
      }
      const [bld, room, seat] = f.seat.split("|");
      S.counters.student++;
      const s = {
        id: String(S.counters.student),
        name: f.name.trim(),
        phone: f.phone.replace(/\D/g, ""),
        bld,
        room,
        seat,
        rent: +f.rent,
        college: f.college || "—",
        school: f.school || "—",
        batch: f.batch || "—",
        father: f.father || "—",
        start: S.now,
        admission: S.now,
        status: "active",
      };
      S.students.push(s);
      makeToken(s, S.period, "admission", admissionLines(s.rent, S.now).lines);
      log(`student.admit ${s.name} (${s.id}) · ${bld} ${room}-${seat}`);
      MODAL = { type: "admitted", sid: s.id };
      render();
    },
    "to-student"(e, el) {
      UI.role = "student";
      UI.sid = el.dataset.sid;
      MODAL = null;
      go("home");
    },
    "pay-new"(e, el) {
      MODAL = { type: "pay", sid: el.dataset.sid || UI.p.id };
      render();
    },
    "pay-save"() {
      const m = MODAL;
      const sid = $("#p-sid").value,
        amt = +String($("#p-amt").value).replace(/,/g, ""),
        acct = $("#p-acct").value,
        trx = $("#p-trx").value.trim();
      if (!(amt > 0)) {
        toast("Amount must be more than 0");
        return;
      }
      if (acct !== "cash" && !trx) {
        toast("Enter the TrxID", "bKash/Nagad-এর জন্য TrxID লাগে।");
        return;
      }
      const p = takePayment(sid, amt, acct, S.now, acct === "cash" ? "" : trx, ROLES[UI.role].user || "Office");
      MODAL = { type: "receipt", no: p.no };
      render();
      toast("Payment saved · " + p.no, "রসিদ ছাত্রের ফোনেও চলে গেল।");
    },
    receipt(e, el) {
      MODAL = { type: "receipt", no: el.dataset.id };
      render();
    },
    token(e, el) {
      MODAL = { type: "token", id: el.dataset.id };
      render();
    },
    "grid-tog"(e, el) {
      const date = UI.p.date || S.now;

      log(`meal.save_day ${date} ${stud(sid).name} ${SL[sl]}`);
      render();
    },
    "meal-day"(e, el) {
      const d = addDays(UI.p.date || S.now, +el.dataset.d);
      UI.p = { ...UI.p, date: d };
      render();
    },
    "my-meal"(e, el) {
      const s = stud();
      const { d, sl } = el.dataset;
      if (d < firstEditable()) {
        toast("Too late", "আগের রাতের সময় পার হয়ে গেছে।");
        return;
      }
      if (offBy(s.id, d, sl) === "student") {
        clearOff(s.id, d, sl);
        toast(`${SL[sl]} on ${fdate(d)}: ON`);
      } else {
        setOff(s.id, d, sl, "student");
        toast(`${SL[sl]} on ${fdate(d)}: OFF`, 'অফিসের গ্রিডে "by student" দেখাবে।');
      }
      log(`meal.student ${fdate(d)} ${SL[sl]}`);
      render();

    "me-preview"() {
      UI.p = { ...UI.p, preview: true };

    },
    "me-run"() {
      runMonthEnd();

    },
    rtab(e, el) {
      UI.p = { tab: el.dataset.id };
      render();
    },
    "save-rates"() {
      const n = (id) => +String($(id).value).replace(/,/g, "");
      const r = S.rates;
      const nv = {
        b: n("#r-b"),
        l: n("#r-l"),
        d: n("#r-d"),
        dep: n("#r-dep"),
        bab: n("#r-bab"),
        advM: n("#r-adv"),
        sc: n("#r-sc"),
      };
      if (Object.values(nv).some((v) => !(v >= 0))) {
        toast("Check the numbers");
        return;
      }

      render();
      toast("Rates saved");
    },
    "save-cut"() {
      S.rates.cutoff = +$("#r-cut").value;
      log("settings.meal_cutoff " + cutoffText());
      render();
      toast("Saved", `ছাত্ররা আগের রাত ${cutoffText()} পর্যন্ত মিল বদলাতে পারবে।`);
    },
  };
  document.addEventListener("click", (e) => {
    const m = e.target.closest("[data-mode]");
    if (m) {
      UI.mode = m.dataset.mode;
      MODAL = null;
      render();
      window.scrollTo(0, 0);
      return;
    }
    const j = e.target.closest("[data-jump]");
    if (j) {
      document.getElementById(j.dataset.jump)?.scrollIntoView({ behavior: "smooth" });
      return;
    }
    const r = e.target.closest("[data-role]");
    if (r) {
      UI.role = r.dataset.role;
      UI.view = UI.role === "student" ? "home" : "dash";
      UI.p = {};
      if (UI.role === "student" && rahim() && !UI.sidChosen) UI.sid = rahim().id;
      MODAL = null;
      render();
      return;
    }
    const g = e.target.closest("[data-go]");
    if (g && !e.target.closest("[data-act]")) {
      let p = {};
      try {
        p = g.dataset.p ? JSON.parse(g.dataset.p) : {};
      } catch (_) {}
      go(g.dataset.go, p);
      return;
    }
    const a = e.target.closest("[data-act]");
    if (a && ACT[a.dataset.act] && a.tagName !== "SELECT") {
      ACT[a.dataset.act](e, a);
    }
  });
  document.addEventListener("input", (e) => {
    const f = e.target.dataset.f;
    if (f && MODAL && MODAL.f) {
      MODAL.f[f] = e.target.value;
      if (f === "seat") {
        const [b, rm] = e.target.value.split("|");
        MODAL.f.rent = String(S.buildings.find((x) => x.code === b).rooms[rm].rent);
        const ri = $("#a-rent");
        if (ri) ri.value = MODAL.f.rent;
      }
    }
  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "sidpick") {
      UI.sid = e.target.value;
      UI.sidChosen = true;
      render();
      return;
    }
    if (e.target.dataset.act === "meal-bld") {
      UI.p = { ...UI.p, bld: e.target.value };
      render();
      return;
    }
    if (e.target.id === "p-sid" && MODAL) {
      MODAL = { type: "pay", sid: e.target.value, acct: $("#p-acct").value, trx: $("#p-trx").value };
      render();
      return;
    }
    const f = e.target.dataset.f;
    if (f && MODAL && MODAL.f) {
      MODAL.f[f] = e.target.value;
      if (f === "seat") {
        const [b, rm] = e.target.value.split("|");
        MODAL.f.rent = String(S.buildings.find((x) => x.code === b).rooms[rm].rent);
        render();
      }
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && MODAL) {
      MODAL = null;
      render();
    }
  });
  window.addEventListener("resize", () => {
    const tb = $("#top");
    if (tb) document.documentElement.style.setProperty("--th", tb.offsetHeight + "px");
  });

  load();
  if (window.innerWidth < 1180) UI.guide = false;
  lastStep = curStep();
  render();
</script>
